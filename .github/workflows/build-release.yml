name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Piper binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p piper-bin
          curl -L -o piper_windows_amd64.zip https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip
          unzip -o piper_windows_amd64.zip -d piper-bin
          # The zip extracts to piper-bin/piper/ - move contents up one level
          if [ -d "piper-bin/piper" ]; then
            mv piper-bin/piper/* piper-bin/
            rmdir piper-bin/piper
          fi
          ls -la piper-bin/

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          rm -rf dist dist-installer
          npm run build:win:full:ci
          # Verify installer was created
          ls -la dist-installer/
          ls -la dist-installer/*.exe 2>/dev/null || true

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run build:mac -- --publish never

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux -- --publish never

      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p ./artifacts
          echo "=== Searching for artifacts in ${GITHUB_WORKSPACE} ==="
          find "${GITHUB_WORKSPACE}" -maxdepth 5 -type f \( -name "Summie*-Setup.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) \
            \( -path "*/dist/*" -o -path "*/dist-installer/*" -o -path "*/release/*" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/win-unpacked/*" \
            -not -path "*/mac-unpacked/*" \
            -not -path "*/linux-unpacked/*" \
            -not -name "elevate.exe" \
            -exec echo "Found: {}" \; \
            -exec cp {} ./artifacts/ \;
          echo "=== Artifacts folder ==="
          ls -la ./artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Summie-${{ matrix.os }}
          path: ./artifacts/*
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Delete existing release
        run: gh release delete "$GITHUB_REF_NAME" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p ./release-files
          find ./artifacts -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" | while read file; do
            cp "$file" ./release-files/
          done
          ls -la ./release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}