name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./app

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run build:mac

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux

      - name: Debug dist folder
        run: |
          echo "=== Current dir ==="
          pwd
          echo "=== Parent dir contents ==="
          ls -la ..
          echo "=== Dist folder (if exists) ==="
          ls -la ../dist/ 2>/dev/null || echo "dist not found"
          ls -la ../dist/*.exe 2>/dev/null || echo "no exe"
          ls -la ../dist/*.dmg 2>/dev/null || echo "no dmg"
          ls -la ../dist/*.AppImage 2>/dev/null || echo "no AppImage"
          ls -la ../dist/*.deb 2>/dev/null || echo "no deb"

      - name: Copy artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p ./artifacts
          cp ../dist/*.exe ./artifacts/ 2>/dev/null || true
          cp ../dist/*.dmg ./artifacts/ 2>/dev/null || true
          cp ../dist/*.AppImage ./artifacts/ 2>/dev/null || true
          cp ../dist/*.deb ./artifacts/ 2>/dev/null || true
          cp ../dist/*.blockmap ./artifacts/ 2>/dev/null || true
          cp ../dist/*.yml ./artifacts/ 2>/dev/null || true

      - name: Copy artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts | Out-Null
          Copy-Item -Path ../dist/*.exe -Destination ./artifacts/ -ErrorAction SilentlyContinue
          Copy-Item -Path ../dist/*.dmg -Destination ./artifacts/ -ErrorAction SilentlyContinue
          Copy-Item -Path ../dist/*.AppImage -Destination ./artifacts/ -ErrorAction SilentlyContinue
          Copy-Item -Path ../dist/*.deb -Destination ./artifacts/ -ErrorAction SilentlyContinue
          Copy-Item -Path ../dist/*.blockmap -Destination ./artifacts/ -ErrorAction SilentlyContinue
          Copy-Item -Path ../dist/*.yml -Destination ./artifacts/ -ErrorAction SilentlyContinue

      - name: Debug artifacts folder
        run: |
          echo "=== Artifacts folder ==="
          ls -la ./artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Summie-${{ matrix.os }}
          path: ./artifacts/*
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p ./release-files
          find ./artifacts -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" | while read file; do
            cp "$file" ./release-files/
          done
          ls -la ./release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}